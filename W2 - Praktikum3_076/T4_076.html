<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Penghitung Jumlah Klik</title>
</head>

<body>
    <h1>Penghitung Jumlah Klik - T4_076</h1>
    <button id="tombolKlik">Klik Saya</button>
    <p>Jumlah Klik: <span id="jumlahKlik">0</span></p>

    <script>
        let jumlahKlik = 0;

        const tombolKlik = document.getElementById('tombolKlik');
        const jumlahKlikText = document.getElementById('jumlahKlik');
        tombolKlik.addEventListener("click", function () {
            jumlahKlik++;

            jumlahKlikText.textContent = jumlahKlik;
        });
    </script>
</body>

</html>
