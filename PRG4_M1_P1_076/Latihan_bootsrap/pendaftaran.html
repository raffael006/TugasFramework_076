<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran - Website Bootstrap</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">MyWebsite</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="data.html">Data Anggota (Tabel)</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="pendaftaran.html">Form Pendaftaran</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Content Form -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Formulir Pendaftaran Anggota</h4>
                    </div>
                    <div class="card-body p-4">
                        <form action="#" method="POST">

                            <!-- 1. Textbox (Nama & Email) -->
                            <div class="mb-3">
                                <label for="nama" class="form-label fw-bold">Nama Lengkap (Textbox)</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap Anda" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">Email (Textbox)</label>
                                <input type="email" class="form-control" id="email" placeholder="nama@email.com" required>
                            </div>

                            <!-- 2. Dropdown List -->
                            <div class="mb-3">
                                <label for="prodi" class="form-label fw-bold">Program Studi (Dropdown List)</label>
                                <select class="form-select" id="prodi" required>
                                    <option value="" selected disabled>-- Pilih Program Studi --</option>
                                    <option value="Teknik Informatika">Teknik Informatika</option>
                                    <option value="Sistem Informasi">Sistem Informasi</option>
                                    <option value="Teknik Komputer">Teknik Komputer</option>
                                    <option value="Manajemen Informatika">Manajemen Informatika</option>
                                </select>
                            </div>

                            <!-- 3. Radio Button -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Jenis Kelamin (Radio Button)</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jenis_kelamin" id="jk_laki" value="Laki-laki" required>
                                    <label class="form-check-label" for="jk_laki">Laki-laki</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jenis_kelamin" id="jk_perempuan" value="Perempuan">
                                    <label class="form-check-label" for="jk_perempuan">Perempuan</label>
                                </div>
                            </div>

                            <!-- 4. Checkbox -->
                            <div class="mb-3">
                                <label class="form-label fw-bold d-block">Minat / Hobi (Checkbox)</label>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="Web Development" id="minat1">
                                    <label class="form-check-label" for="minat1">Web Development</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="UI/UX Design" id="minat2">
                                    <label class="form-check-label" for="minat2">UI/UX Design</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" value="Data Science" id="minat3">
                                    <label class="form-check-label" for="minat3">Data Science</label>
                                </div>
                            </div>

                            <!-- 5. Textarea -->
                            <div class="mb-3">
                                <label for="alamat" class="form-label fw-bold">Alamat Lengkap (Textarea)</label>
                                <textarea class="form-control" id="alamat" rows="4" placeholder="Tuliskan alamat lengkap tempat tinggal Anda" required></textarea>
                            </div>

                            <!-- Checkbox Persetujuan -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="setuju" required>
                                <label class="form-check-label" for="setuju">Saya menyatakan data yang diisi adalah benar.</label>
                            </div>

                            <!-- Tombol Submit & Reset -->
                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <button type="reset" class="btn btn-secondary me-md-2">Reset</button>
                                <button type="submit" class="btn btn-primary px-4">Kirim Pendaftaran</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 MyWebsite. Dibuat dengan Bootstrap 5.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
