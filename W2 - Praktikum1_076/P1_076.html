<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>P1_076</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .container {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Kalkulator Sederhana</h1>
        <button onclick="mulaiKalkulator()">Mulai Kalkulator</button>
        <h4>P1_076</h4>
        <div id="hasil"></div>
    </div>

    <script>
        function mulaiKalkulator() {
            const input = prompt("Masukkan operasi (Contoh 2+3, 4-1, 5*2, 10/2): ");
            if (!input) {
                alert("Operasi Dibatalkan");
                return;
            }
            const match = input.match(/^(\d+)\s*([\+\-\*\/])\s*(\d+)$/);
            if (!match) {
                alert("Format input tidak valid! Gunakan format angka1+angka2");
                return;
            }
            const angka1 = parseFloat(match[1]);
            const operasi = match[2];
            const angka2 = parseFloat(match[3]);
            let hasil;

            switch (operasi) {
                case '+':
                    hasil = angka1 + angka2;
                    break;
                case '-':
                    hasil = angka1 - angka2;
                    break;
                case '*':
                    hasil = angka1 * angka2;
                case '/':
                    if (angka2 === 0) {
                        alert("Tidak bisa membagi dengan nol.");
                        return;
                    }
                    hasil = angka1 / angka2;
                    break;
                default:
                    alert("Operasi tidak valid!");
                    return;
            }
            alert(`Hasil: ${hasil}`);
        }
    </script>
</body>

</html>
