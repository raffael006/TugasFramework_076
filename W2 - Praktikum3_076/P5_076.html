<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Formulir Interaktif</title>
</head>

<body>
    <h1>Formulir Interaktif - P5_076</h1>
    <form id="myForm">
        <label for="userInput">Masukkan Nama:</label>
        <input type="text" id="userInput" placeholder="Masukkan nama Anda" />
        <button type="submit">Kirim</button>
    </form>
    <p id="message"></p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('myForm');
            const message = document.getElementById('message');

            form.addEventListener('submit', (event) => {
                event.preventDefault();

                const userInput = document.getElementById('userInput').value;
                if (userInput.trim()) {
                    message.textContent = `Terimakasih, ${userInput}! Formulir telah dikirim.`;
                } else {
                    message.textContent = 'Silahkan masukkan nama Anda';
                }
            });
        });
    </script>
</body>

</html>
