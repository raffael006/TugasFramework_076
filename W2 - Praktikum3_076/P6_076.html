<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Daftar Tugas</title>

    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }

        button {
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <h1>Daftar Tugas - P6_076</h1>

    <input type="text" id="inputTugas" placeholder="Masukkan Tugas" />

    <button onclick="tambahTugas()">Tambah Tugas</button>

    <button onclick="tampilkanTugas()">Tampilkan Daftar Tugas</button>

    <ul id="listTugas" style="display: none;"></ul>


    <script>

        let daftarTugas = [];


        function tambahTugas() {

            const input = document.getElementById('inputTugas');
            const tugas = input.value.trim();

            if (tugas) {

                daftarTugas.push({
                    text: tugas,
                    completed: false
                });

                console.log(`Tugas "${tugas}" berhasil ditambahkan.`);

                input.value = '';

                alert(`Tugas "${tugas}" berhasil ditambahkan.`);

            } else {

                alert("Masukkan tugas yang valid.");

            }
        }


        // Fungsi untuk menampilkan daftar tugas
        function tampilkanTugas() {

            const list = document.getElementById('listTugas');

            list.innerHTML = '';

            if (daftarTugas.length === 0) {

                list.innerHTML = '<li>Tidak ada tugas.</li>';

            } else {

                daftarTugas.forEach((tugas, indeks) => {

                    // Membuat elemen list
                    const li = document.createElement('li');

                    // Membuat checkbox
                    const checkbox = document.createElement('input');

                    checkbox.type = 'checkbox';

                    checkbox.checked = tugas.completed;

                    checkbox.onchange = () => tandaiSelesai(indeks);


                    // Membuat teks tugas
                    const span = document.createElement('span');

                    span.textContent = tugas.text;

                    if (tugas.completed) {
                        span.classList.add('completed');
                    }


                    // Membuat tombol hapus
                    const btnHapus = document.createElement('button');

                    btnHapus.textContent = 'Hapus';

                    btnHapus.onclick = () => hapusTugas(indeks);


                    // Memasukkan elemen ke li
                    li.appendChild(checkbox);

                    li.appendChild(span);

                    li.appendChild(btnHapus);


                    // Memasukkan li ke list
                    list.appendChild(li);

                });
            }

            // Menampilkan daftar
            list.style.display = 'block';
        }


        function hapusTugas(indeks) {

            if (indeks >= 0 && indeks < daftarTugas.length) {

                const tugasTerhapus = daftarTugas.splice(indeks, 1)[0];

                console.log(`Tugas "${tugasTerhapus.text}" berhasil dihapus.`);

                alert(`Tugas "${tugasTerhapus.text}" berhasil dihapus.`);

                tampilkanTugas();

            } else {

                alert("Indeks tugas tidak valid.");

            }
        }


        function tandaiSelesai(indeks) {

            daftarTugas[indeks].completed =
                !daftarTugas[indeks].completed;

            tampilkanTugas();
        }

    </script>

</body>

</html>
