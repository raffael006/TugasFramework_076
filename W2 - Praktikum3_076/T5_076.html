<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>Pengubah Warna Latar Belakang</title>
</head>

<body>
    <h1>Pengubah Warna Latar Belakang - 076</h1>

    <button id="tombolWarna">Ubah Warna Latar Belakang</button>

    <script>
        const tombolWarna = document.getElementById('tombolWarna');
        tombolWarna.addEventListener("click", function () {
            const warna = "#" + Math.floor(Math.random() * 16777215).toString(16);

            document.body.style.backgroundColor = warna;
        });
    </script>
</body>

</html>
